name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Compile translations (.po → .mo + JSON)
        run: |
          sudo apt-get install -y gettext
          curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          for po in languages/*.po; do
            msgfmt "$po" -o "${po%.po}.mo"
          done
          php wp-cli.phar i18n make-json languages/ --no-purge --allow-root

      - name: Stage plugin folder
        run: |
          mkdir -p build-dist/wp-popup-manager
          rsync -av --exclude-from='.distignore' \
            --exclude='build-dist' --exclude='.git' --exclude='node_modules' \
            ./ build-dist/wp-popup-manager/

      - name: Create zip
        run: |
          cd build-dist
          zip -r ../wp-popup-manager.zip wp-popup-manager

      - name: Attach zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: wp-popup-manager.zip
          generate_release_notes: true
