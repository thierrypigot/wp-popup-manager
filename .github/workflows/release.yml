name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Stage plugin folder
        run: |
          mkdir -p build-dist/wp-popup-manager
          rsync -av --exclude-from='.distignore' \
            --exclude='build-dist' --exclude='.git' --exclude='node_modules' \
            ./ build-dist/wp-popup-manager/

      - name: Create zip
        run: |
          cd build-dist
          zip -r ../wp-popup-manager.zip wp-popup-manager

      - name: Attach zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: wp-popup-manager.zip
          generate_release_notes: true
